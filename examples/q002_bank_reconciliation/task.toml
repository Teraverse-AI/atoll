version = "1.0"

[metadata]
id = "q002_bank_reconciliation"
title = "Monthly bank reconciliation"
category = "accounting"
difficulty = "medium"
tags = ["bank-reconciliation", "cash"]

[agent]
max_steps = 40
timeout = 1800
token_budget = 128000

[atoll]
instruction_file = "instruction.md"
workspace_dir = "workspace"
gold_answer = "gold_answer.json"

[[atoll.verifiers]]
type = "file_exists"
path = "reconciliation.json"

[[atoll.verifiers]]
type = "numeric_tolerance"
path = "reconciliation.json"
field = "adjusted_bank_balance"
gold_field = "adjusted_bank_balance"
tolerance = 0.01
