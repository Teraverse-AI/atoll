version = "1.0"

[metadata]
id = "q001_adjusting_entry"
title = "Year-end adjusting entry for prepaid insurance"
category = "accounting"
difficulty = "easy"
tags = ["adjusting-entries", "prepaid-expenses"]

[agent]
max_steps = 25
timeout = 1800
token_budget = 128000

[atoll]
instruction_file = "instruction.md"
workspace_dir = "workspace"
gold_answer = "gold_answer.json"

[[atoll.verifiers]]
type = "file_exists"
path = "adjusting_entry.json"

[[atoll.verifiers]]
type = "debit_credit"
path = "adjusting_entry.json"

[[atoll.verifiers]]
type = "numeric_tolerance"
path = "adjusting_entry.json"
field = "entries"
gold_field = "entries"
tolerance = 0.01
