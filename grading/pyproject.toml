[project]
name = "atoll-grading"
version = "0.1.0"
description = "Atoll grader: per-rubric-item LLM judge over LibreOffice-recalculated renderings"
requires-python = ">=3.12"
dependencies = [
    "atoll-agents",
    "atoll-tools",
    "atoll-environment",
]

[project.scripts]
atoll-grade = "atoll_grading.main:main"

[tool.uv.sources]
atoll-agents = { workspace = true }
atoll-tools = { workspace = true }
atoll-environment = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atoll_grading"]
