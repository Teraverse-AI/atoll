[project]
name = "atoll-agents"
version = "0.1.0"
description = "Atoll agent harness: LiteLLM tool-calling loop over a ToolProvider"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.60",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "pillow>=10.0",
    "atoll-tools",
    "atoll-environment",
]

[project.scripts]
atoll-run = "runner.main:main"

[tool.uv.sources]
atoll-tools = { workspace = true }
atoll-environment = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runner"]
