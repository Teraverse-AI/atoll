[project]
name = "atoll-agents"
version = "0.1.0"
description = "Atoll agent harness: LiteLLM tool-calling loop over a ToolProvider"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.60",
    # Not used by Atoll (native tools only): litellm imports its MCP-gateway handler,
    # which needs `mcp`, on every tool-carrying call (upstream gets it via fastmcp).
    "mcp>=2.3",
    "pyyaml>=6.0",  # runner/model_config.yaml
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "pillow>=10.0",
    # Upstream grading's file-extraction layer (vendored in runner/utils/file_extraction;
    # versions as in archipelago grading/pyproject.toml at the pinned commit).
    "httpx>=0.27.0",
    "lxml>=5.0.0",
    "openpyxl>=3.1.0",
    "pdf2image>=1.17.0",
    "pypdf>=6.9.2",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "tenacity>=9.0.0",
    "xlrd>=2.0.1",
    "atoll-tools",
    "atoll-environment",
]

[project.scripts]
atoll-run = "runner.main:main"

[tool.uv.sources]
atoll-tools = { workspace = true }
atoll-environment = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runner"]
