name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Public repo only: skipped (no minutes, no emails) on the private dev repo.
    if: github.repository == 'Teraverse-AI/atoll'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Exact tag: setup-uv stopped publishing major/minor tags in v8.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q
